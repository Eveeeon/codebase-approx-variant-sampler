[llvm]
llvm_dir = "/usr/lib/llvm-18/lib/cmake/llvm"
llvm_compiler = "clang"
opt = "opt"
source_file_type = "cpp"

[paths]
# Out
out_dir = "out"
experiments_dir = "experiments"
subject_bc_dir = "subject_bitcode"
export_graph_dir = "graph_export"
# CPP
cpp_build_dir = "cpp/build"
passes_build_dir = "cpp/build/passes"
passes_library = "cpp/build/passes/FPApprox.so"
# Python
python_dir = "python"
# Subject
subject = "test_subject"

[passes]
export_pass = "export-graph"
transform_pass = "reduce-precision"

[energibridge]
enrg_brg_apple_aarch64 = "x86_64-unknown-linux-musl"
enrg_brg_apple_darwin = "x86_64-unknown-linux-musl"
enrg_brg_win_x86 = "x86_64-unknown-linux-musl"
enrg_brg_linux_x86 = "x86_64-unknown-linux-musl"
enrg_brg_base_url = "https://github.com/tdurieux/EnergiBridge/releases/download/"
enrg_brg_version = "0.0.7"
enrg_brg_install_dir = "third_party/energibridge"
