[llvm]
llvm_dir = "/usr/lib/llvm-18/lib/cmake/llvm"
llvm_compiler = "clang"
opt = "opt"

[paths]
out = "out"
experiments = "out/experiments"
export_graph = "out/export/fpgraph.json"
cpp_build_dir = "cpp/build"
passes_build_dir = "cpp/build/passes"
passes_library = "cpp/build/passes/FPApprox.so"
python_dir = "python"
subject = "subject"
subject_bc = "out/bitcode/original.bc"

[build]
optimization = "O1"
source_file_type = "cpp"

[passes]
export_pass = "export-graph"
transform_pass = "reduce-precision"

[experiment]
id = "test-01"

repetitions = 20

from_type = "fp64"
to_type = "fp32"

reduction_rates = [
    0.1,
    0.2,
    0.4,
    0.5,
    0.6,
    0.7,
    0.8,
    0.9
]

base_seed = 12345