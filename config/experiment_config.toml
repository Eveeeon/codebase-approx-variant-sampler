[experiment]
# Name of source code
source_project_name = "LULESH"
# Experiment id
id = "LULESH-01"
# The file extension of source files
# cpp | c | ...
source_file_type = "cc"
# File extension of file that stdout is written to
# "csv" | "txt" | "json"...
stdout_file_type = "txt"
# File extension of file that sterr is written to
# "csv" | "txt" | "json"...
stderr_file_type = "txt"
# What type of floating point operations should be reduced to what other
# "fp64" | "fp32" | "fp16"
from_type = "fp64"
# "fp64" | "fp32" | "fp16"
to_type = "fp32"
# List of reduction rates for the experiment to run
# 0.1 means ~10% of eligible floating point operations will be reduced
reduction_rates = [
    0.1,
    0.2,
    0.4,
    0.5,
    0.6,
    0.7,
    0.8,
    0.9
]
# Number of randomly generated variants created for each reduction rate
variants_per_rate = 5
# Number of times each variant is repeated during energy evaluation
repeat_variant = 5
# Time in seconds to pause between energy measurements of variants
pause_between_variants = 3
# Number of times the entire experiment evaluation is repeated
repeat_evaluation = 3
# Random number seed
base_seed = 12345

[adapter]
# A string of all compile flags to add to the subject compilation
# "" for none
compile_flags = "-DUSE_MPI=0"
# A string of all compillation include flags to add to the subject compilation
# All directories should be relative to the root of the subject and not contain any spaces
# Each directory should be separated by a space
# "" for none
include_flags = ""
# Value to pass into stdin
# "" for none
stdin = ""
# List of values to pass as args
# [] for none
args = ["-s", "20"]

[builder]
link_flags = "-lm -lstdc++"

[aggregator]
# The absolute file path to where output files are generated
# "" defaults to stdout file path
out_file_dir = ""
# The file type extension of out files
# "csv" | "txt" | "json"...
# "" defaults to stdout_file_type
out_file_type = ""

[energibridge]
# SET NAME OF PLATFORM HERE TO ONE OF THE OPTIONS BELOW
# "enrg_brg_apple_aarch64" | "enrg_brg_apple_darwin" | "enrg_brg_win_x86" | "enrg_brg_linux_x86"
enrg_brg_platform = "enrg_brg_linux_x86"
# Integer number of milliseconds, 200 or more
enrg_brg_interval = 200
